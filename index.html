<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calorimetry Practice Master</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom sleek dark scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950">
  <div id="root" class="min-h-screen flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Standard materials & specific heat values (J / (g * unit))
    const MATERIALS = [
      { name: "Water", c: 4.18 },
      { name: "Aluminum", c: 0.897 },
      { name: "Iron", c: 0.449 },
      { name: "Copper", c: 0.385 },
      { name: "Gold", c: 0.129 },
      { name: "Ethanol", c: 2.44 },
      { name: "Glass", c: 0.840 },
      { name: "Granite", c: 0.790 }
    ];

    const toSigFigs = (val, sig = 3) => {
      if (val === null || val === undefined || isNaN(val) || !isFinite(val)) return val;
      return Number(Number(val).toPrecision(sig));
    };

    const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const randomChoice = (arr) => arr[Math.floor(Math.random() * arr.length)];

    // Generates a calorimetry problem solving for E, m, c, ΔT, or T_f
    const generateProblem = () => {
      const type = randomChoice(['solve_E', 'solve_m', 'solve_c', 'solve_deltaT', 'solve_Tf']);
      const tempUnit = randomChoice(['°C', 'K']);
      const mat = randomChoice(MATERIALS);

      let mass = toSigFigs(randomInt(15, 450), 3); // in grams
      let cVal = toSigFigs(mat.c, 3); // J / (g * tempUnit)

      // Base temperatures in consistent unit
      let tInitial = tempUnit === '°C' ? toSigFigs(randomInt(15, 35), 3) : toSigFigs(randomInt(288, 308), 3);
      let deltaT = toSigFigs(randomInt(12, 65), 3);
      let tFinal = toSigFigs(tInitial + deltaT, 3);

      // E = m * c * deltaT (in Joules)
      let rawE = mass * cVal * deltaT;
      let energyJ = toSigFigs(rawE, 3);

      let target = '';
      let expectedAnswer = 0;
      let targetUnit = '';
      let text = '';
      let givens = [];
      let cUnit = `J/(g·${tempUnit})`;

      if (type === 'solve_E') {
        target = 'E';
        expectedAnswer = energyJ;
        targetUnit = 'J';
        text = `A ${mass} g sample of ${mat.name} (c = ${cVal} ${cUnit}) absorbs heat, raising its temperature from ${tInitial} ${tempUnit} to ${tFinal} ${tempUnit}. Calculate the energy E absorbed in Joules.`;
        givens = [
          { id: 'm', label: `${mass} g`, correctVar: 'm' },
          { id: 'c', label: `${cVal} ${cUnit}`, correctVar: 'c' },
          { id: 'Ti', label: `${tInitial} ${tempUnit}`, correctVar: 'T_i' },
          { id: 'Tf', label: `${tFinal} ${tempUnit}`, correctVar: 'T_f' }
        ];
      } else if (type === 'solve_m') {
        target = 'm';
        expectedAnswer = mass;
        targetUnit = 'g';
        text = `An unknown mass m of ${mat.name} (c = ${cVal} ${cUnit}) absorbs ${energyJ} J of energy, resulting in a temperature change ΔT of ${deltaT} ${tempUnit}. Calculate the mass of the sample in grams.`;
        givens = [
          { id: 'E', label: `${energyJ} J`, correctVar: 'E' },
          { id: 'c', label: `${cVal} ${cUnit}`, correctVar: 'c' },
          { id: 'dT', label: `${deltaT} ${tempUnit}`, correctVar: 'ΔT' }
        ];
      } else if (type === 'solve_c') {
        target = 'c';
        expectedAnswer = cVal;
        targetUnit = cUnit;
        text = `A ${mass} g sample of an unknown substance absorbs ${energyJ} J of energy E as its temperature increases by ${deltaT} ${tempUnit}. Calculate the specific heat capacity c of the substance in ${cUnit}.`;
        givens = [
          { id: 'E', label: `${energyJ} J`, correctVar: 'E' },
          { id: 'm', label: `${mass} g`, correctVar: 'm' },
          { id: 'dT', label: `${deltaT} ${tempUnit}`, correctVar: 'ΔT' }
        ];
      } else if (type === 'solve_deltaT') {
        target = 'ΔT';
        expectedAnswer = deltaT;
        targetUnit = tempUnit;
        text = `A ${mass} g sample of ${mat.name} (c = ${cVal} ${cUnit}) absorbs ${energyJ} J of energy E. Calculate the overall change in temperature ΔT in ${tempUnit}.`;
        givens = [
          { id: 'E', label: `${energyJ} J`, correctVar: 'E' },
          { id: 'm', label: `${mass} g`, correctVar: 'm' },
          { id: 'c', label: `${cVal} ${cUnit}`, correctVar: 'c' }
        ];
      } else if (type === 'solve_Tf') {
        target = 'T_f';
        expectedAnswer = tFinal;
        targetUnit = tempUnit;
        text = `A ${mass} g sample of ${mat.name} (c = ${cVal} ${cUnit}) has an initial temperature T_i of ${tInitial} ${tempUnit}. If it absorbs ${energyJ} J of heat energy E, calculate the final temperature T_f in ${tempUnit}.`;
        givens = [
          { id: 'E', label: `${energyJ} J`, correctVar: 'E' },
          { id: 'm', label: `${mass} g`, correctVar: 'm' },
          { id: 'c', label: `${cVal} ${cUnit}`, correctVar: 'c' },
          { id: 'Ti', label: `${tInitial} ${tempUnit}`, correctVar: 'T_i' }
        ];
      }

      const shuffledGivens = [...givens].sort(() => Math.random() - 0.5);

      return {
        id: Date.now(),
        type,
        text,
        tempUnit,
        cUnit,
        target,
        expectedAnswer,
        targetUnit,
        energyJ,
        mass,
        cVal,
        tInitial,
        tFinal,
        deltaT,
        givens: shuffledGivens
      };
    };

    // SVG Icon Component
    const Icon = ({ name, className = "w-4 h-4" }) => {
      const icons = {
        Flame: (
          <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
        ),
        Sparkles: (
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
        ),
        Award: (
          <g>
            <circle cx="12" cy="8" r="6" />
            <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11" />
          </g>
        ),
        BookOpen: (
          <g>
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
          </g>
        ),
        Calculator: (
          <g>
            <rect width="16" height="20" x="4" y="2" rx="2" />
            <line x1="8" x2="16" y1="6" y2="6" />
            <line x1="16" x2="16" y1="14" y2="18" />
            <path d="M16 10h.01" />
            <path d="M12 10h.01" />
            <path d="M8 10h.01" />
            <path d="M12 14h.01" />
            <path d="M8 14h.01" />
            <path d="M12 18h.01" />
            <path d="M8 18h.01" />
          </g>
        ),
        RefreshCw: (
          <g>
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </g>
        ),
        Info: (
          <g>
            <circle cx="12" cy="12" r="10" />
            <path d="M12 16v-4" />
            <path d="M12 8h.01" />
          </g>
        ),
        Tag: (
          <g>
            <path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z" />
            <line x1="7" x2="7.01" y1="7" y2="7" />
          </g>
        ),
        Zap: (
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
        ),
        ArrowRight: (
          <g>
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </g>
        ),
        CheckCircle2: (
          <g>
            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" />
            <path d="m9 12 2 2 4-4" />
          </g>
        ),
        XCircle: (
          <g>
            <circle cx="12" cy="12" r="10" />
            <path d="m15 9-6 6" />
            <path d="m9 9 6 6" />
          </g>
        ),
        ChevronRight: (
          <path d="m9 18 6-6-6-6" />
        ),
        Check: (
          <path d="M20 6 9 17l-5-5" />
        ),
        Thermometer: (
          <path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z" />
        ),
        X: (
          <g>
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </g>
        )
      };

      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          {icons[name] || null}
        </svg>
      );
    };

    // Fraction layout helper for formulas
    const FractionExpr = ({ lhs, num, den, className = "" }) => {
      if (!den) {
        return (
          <div className={`inline-flex items-center gap-2 font-mono font-bold ${className}`}>
            {lhs && <span><FormattedText text={lhs} /> =</span>}
            <span><FormattedText text={num} /></span>
          </div>
        );
      }

      return (
        <div className={`inline-flex items-center gap-3 font-mono font-bold ${className}`}>
          {lhs && <span><FormattedText text={lhs} /> =</span>}
          <div className="inline-flex flex-col items-center justify-center text-center">
            <span className="px-2 py-1 border-b-2 border-current w-full text-center leading-none"><FormattedText text={num} /></span>
            <span className="px-2 py-1 text-center leading-none"><FormattedText text={den} /></span>
          </div>
        </div>
      );
    };

    // Helper to format text with proper subscript tags for T_i and T_f
    const FormattedText = ({ text }) => {
      if (text === null || text === undefined) return null;
      if (typeof text !== 'string') return <span>{text}</span>;
      const parts = text.split(/(T_i|T_f)/g);
      return (
        <span>
          {parts.map((part, idx) => {
            if (part === 'T_i') return <span key={idx}>T<sub>i</sub></span>;
            if (part === 'T_f') return <span key={idx}>T<sub>f</sub></span>;
            return part;
          })}
        </span>
      );
    };

    function App() {
      // Always default to 'problem' (Direct Answer mode)
      const [appMode, setAppMode] = useState('problem');
      const [problem, setProblem] = useState(null);
      const [currentStep, setCurrentStep] = useState(1);
      const [autoRedirectMessage, setAutoRedirectMessage] = useState(false);
      
      // Step 1 State: Givens & Target Mapping
      const [userAssignments, setUserAssignments] = useState({}); 
      const [userTargetVar, setUserTargetVar] = useState('');
      const [step1Error, setStep1Error] = useState('');

      // Step 2 State: Formula Selection
      const [selectedFormula, setSelectedFormula] = useState('');
      const [step2Error, setStep2Error] = useState('');

      // Step 3 & 4 State: Answer Checking
      const [userAnswer, setUserAnswer] = useState('');
      const [answerResult, setAnswerResult] = useState(null);

      // Stats & Modals
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);
      const [completedCount, setCompletedCount] = useState(0);
      const [showReference, setShowReference] = useState(false);
      const [showCalculator, setShowCalculator] = useState(false);

      // Scratchpad State
      const [calcMass, setCalcMass] = useState('');
      const [calcC, setCalcC] = useState('');
      const [calcDT, setCalcDT] = useState('');
      const [calcE, setCalcE] = useState('');

      useEffect(() => {
        loadNewProblem();
      }, []);

      const loadNewProblem = () => {
        const newProb = generateProblem();
        setProblem(newProb);
        setAppMode('problem'); // Default to direct answer
        setCurrentStep(1);
        setUserAssignments({});
        setUserTargetVar('');
        setStep1Error('');
        setSelectedFormula('');
        setStep2Error('');
        setUserAnswer('');
        setAnswerResult(null);
        setAutoRedirectMessage(false);
      };

      if (!problem) return null;

      // Available variable tags for step 1 mapping
      const ALL_VARS = ['E', 'm', 'c', 'ΔT', 'T_i', 'T_f'];

      // Isolated formulas based on target variable
      const getIsolatedFormulaParts = (targetVar) => {
        const parts = {
          E: { num: "m × c × ΔT", den: "" },
          m: { num: "E", den: "c × ΔT" },
          c: { num: "E", den: "m × ΔT" },
          "ΔT": { num: "E", den: "m × c" },
          "T_f": { num: "T_i + (E / (m × c))", den: "" }
        };
        return parts[targetVar] || { num: "", den: "" };
      };

      // Step 1 Verification
      const handleVerifyStep1 = () => {
        setStep1Error('');

        for (const item of problem.givens) {
          if (!userAssignments[item.id]) {
            setStep1Error(`Please select a variable tag (E, m, c, ΔT, T_i, T_f) for "${item.label}".`);
            return;
          }
          if (userAssignments[item.id] !== item.correctVar) {
            setStep1Error(`Incorrect variable assignment for "${item.label}". Double-check units (J=E, g=m, J/(g·°C)=c, etc.).`);
            return;
          }
        }

        if (!userTargetVar) {
          setStep1Error(`Please select the unknown target variable you are solving for.`);
          return;
        }

        if (userTargetVar !== problem.target) {
          setStep1Error(`Target variable mismatch! The question asks for ${problem.targetUnit}, corresponding to '${problem.target}'.`);
          return;
        }

        setCurrentStep(2);
      };

      // Step 2 Verification
      const handleVerifyStep2 = () => {
        setStep2Error('');
        if (!selectedFormula) {
          setStep2Error(`Please select the equation formula to proceed.`);
          return;
        }
        if (selectedFormula !== problem.target) {
          setStep2Error(`Select the formula rearranged for target '${problem.target}'.`);
          return;
        }
        setCurrentStep(3);
      };

      // Step 3 proceed to Step 4
      const handleConfirmStep3 = () => {
        setCurrentStep(4);
      };

      // Verify numerical answer (Direct & Step 4)
      const handleVerifyAnswer = () => {
        const numericAns = parseFloat(userAnswer);
        if (isNaN(numericAns)) {
          setAnswerResult({ correct: false, msg: 'Please enter a valid numeric value.' });
          return;
        }

        const expected = toSigFigs(problem.expectedAnswer, 3);
        const userSig = toSigFigs(numericAns, 3);
        const tolerance = Math.abs(expected * 0.035); // 3.5% tolerance
        const isCorrect = Math.abs(numericAns - expected) <= Math.max(tolerance, 0.05) || userSig === expected;

        if (isCorrect) {
          setAnswerResult({
            correct: true,
            msg: `🎉 Excellent work! Your answer (${userSig} ${problem.targetUnit}) is correct (to 3 sig figs)!`
          });
          setScore(prev => prev + (appMode === 'problem' ? 150 : 100) + streak * 10);
          setStreak(prev => prev + 1);
          setCompletedCount(prev => prev + 1);
        } else {
          setStreak(0);
          setAnswerResult({
            correct: false,
            msg: `Incorrect calculation. Expected answer (to 3 sig figs) is ${expected} ${problem.targetUnit}.`
          });
        }
      };

      const activeTarget = userTargetVar || problem.target;
      const isolatedParts = getIsolatedFormulaParts(activeTarget);

      const getValForVar = (v) => {
        if (v === activeTarget) return '?';
        if (v === 'E') return `${problem.energyJ} J`;
        if (v === 'm') return `${problem.mass} g`;
        if (v === 'c') return `${problem.cVal}`;
        if (v === 'ΔT') return `${problem.deltaT} ${problem.tempUnit}`;
        if (v === 'T_i') return `${problem.tInitial} ${problem.tempUnit}`;
        if (v === 'T_f') return `${problem.tFinal} ${problem.tempUnit}`;
        return v;
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans selection:bg-amber-500 selection:text-slate-950">
          
          {/* HEADER NAVBAR */}
          <header className="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-30 px-4 py-3 sm:px-8 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center space-x-3">
              <div className="bg-gradient-to-tr from-amber-500 to-orange-500 p-2.5 rounded-xl shadow-lg shadow-amber-500/20">
                <Icon name="Flame" className="w-6 h-6 text-slate-950" />
              </div>
              <div>
                <h1 className="font-bold text-lg sm:text-xl bg-gradient-to-r from-white via-slate-200 to-amber-200 bg-clip-text text-transparent">
                  Calorimetry Practice Master (E = m·c·ΔT)
                </h1>
                <p className="text-xs text-slate-400">Step-by-Step Heat Energy & Temperature Solver</p>
              </div>
            </div>

            {/* STATS & QUICK TOOLS */}
            <div className="flex items-center space-x-3 sm:space-x-6 text-sm">
              <div className="flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
                <Icon name="Award" className="w-4 h-4 text-amber-400" />
                <span className="text-slate-400 font-medium">Score:</span>
                <span className="font-bold text-amber-400">{score}</span>
              </div>

              <div className="flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
                <Icon name="Sparkles" className="w-4 h-4 text-orange-400" />
                <span className="text-slate-400 font-medium">Streak:</span>
                <span className="font-bold text-orange-400">{streak}</span>
              </div>

              <button
                onClick={() => setShowReference(true)}
                className="flex items-center space-x-1.5 bg-amber-600/80 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg font-medium transition text-xs sm:text-sm shadow-sm"
              >
                <Icon name="BookOpen" className="w-4 h-4" />
                <span className="hidden sm:inline">Formula Reference</span>
              </button>

              <button
                onClick={() => setShowCalculator(!showCalculator)}
                className="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg font-medium border border-slate-700 transition text-xs sm:text-sm"
              >
                <Icon name="Calculator" className="w-4 h-4 text-sky-400" />
                <span className="hidden sm:inline">Scratchpad</span>
              </button>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col gap-6">
            
            {/* ACTION & MODE SWITCH BAR */}
            <div className="flex flex-wrap items-center justify-between bg-slate-800/50 border border-slate-800 rounded-2xl p-4 gap-4">
              <div className="flex items-center space-x-2">
                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Mode:</span>
                <div className="inline-flex bg-slate-900 p-1 rounded-xl border border-slate-700">
                  <button
                    onClick={() => {
                      setAppMode('problem');
                      setAnswerResult(null);
                    }}
                    className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition ${
                      appMode === 'problem'
                        ? 'bg-amber-500 text-slate-950 font-bold shadow-md'
                        : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    Direct Answer
                  </button>
                  <button
                    onClick={() => {
                      setAppMode('support');
                      setAnswerResult(null);
                    }}
                    className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition ${
                      appMode === 'support'
                        ? 'bg-amber-500 text-slate-950 font-bold shadow-md'
                        : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    Guided Step-by-Step
                  </button>
                </div>
              </div>

              <div className="flex items-center space-x-3">
                <span className="text-xs text-slate-400 hidden md:inline">
                  Problems Solved: <span className="font-bold text-slate-200">{completedCount}</span>
                </span>
                <button
                  onClick={loadNewProblem}
                  className="flex items-center space-x-2 bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition shadow"
                >
                  <Icon name="RefreshCw" className="w-4 h-4" />
                  <span>Next Problem</span>
                </button>
              </div>
            </div>

            {/* AUTO REDIRECT ALERT MESSAGE */}
            {autoRedirectMessage && (
              <div className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 flex items-start space-x-3 text-amber-300 text-sm animate-fadeIn">
                <Icon name="Info" className="w-5 h-5 flex-shrink-0 mt-0.5 text-amber-400" />
                <div>
                  <p className="font-semibold">Let's walk through this step-by-step!</p>
                  <p className="text-amber-300/80 text-xs sm:text-sm mt-0.5">

              <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                <div className="flex items-center space-x-2">
                  <Icon name="Calculator" className="w-4 h-4 text-sky-400" />
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-200">
                    E = m·c·ΔT Scratchpad
                  </span>
                </div>
                <button
                  onClick={() => setShowCalculator(false)}
                  className="text-slate-400 hover:text-white"
                >
                  <Icon name="X" className="w-4 h-4" />
                </button>
              </div>

              <div className="flex flex-col gap-2.5 text-xs">
                <div>
                  <label className="text-slate-400 block mb-1">Mass m (g):</label>
                  <input
                    type="number"
                    placeholder="g"
                    value={calcMass}
                    onChange={(e) => {
                      const mVal = e.target.value;
                      setCalcMass(mVal);
                      if (mVal && calcC && calcDT) {
                        setCalcE(toSigFigs(parseFloat(mVal) * parseFloat(calcC) * parseFloat(calcDT), 3));
                      }
                    }}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 font-mono text-white outline-none focus:border-amber-500"
                  />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-slate-400 block mb-1">Specific Heat c:</label>
                    <input
                      type="number"
                      placeholder="J/(g·°C)"
                      value={calcC}
                      onChange={(e) => {
                        const cV = e.target.value;
                        setCalcC(cV);
                        if (calcMass && cV && calcDT) {
                          setCalcE(toSigFigs(parseFloat(calcMass) * parseFloat(cV) * parseFloat(calcDT), 3));
                        }
                      }}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 font-mono text-white outline-none focus:border-amber-500"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">Temp Change ΔT:</label>
                    <input
                      type="number"
                      placeholder="°C or K"
                      value={calcDT}
                      onChange={(e) => {
                        const dtV = e.target.value;
                        setCalcDT(dtV);
                        if (calcMass && calcC && dtV) {
                          setCalcE(toSigFigs(parseFloat(calcMass) * parseFloat(calcC) * parseFloat(dtV), 3));
                        }
                      }}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 font-mono text-white outline-none focus:border-amber-500"
                    />
                  </div>
                </div>

                <div className="border-t border-slate-800 pt-2 flex items-center justify-between">
                  <span className="text-slate-400 font-semibold">Energy E (J):</span>
                  <span className="font-mono text-base font-bold text-amber-400">
                    {calcE ? `${calcE} J` : '—'}
                  </span>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-slate-800 py-4 px-6 text-center text-xs text-slate-500 mt-auto">
            Calorimetry Practice Master (E = m·c·ΔT) &bull; Interactive Science Learning Tool
          </footer>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
